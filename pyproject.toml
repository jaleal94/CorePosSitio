[project]
name = "core-pos-sitio"
version = "0.1.0"
description = "Sitio de presentacion de Core Pos"
# Vercel construye y ejecuta con 3.12, asi que declarar 3.13 seria decir algo
# que no es cierto. El codigo no usa nada exclusivo de 3.13: se comprobo
# corriendolo entero en 3.12 y en 3.14.
requires-python = ">=3.12,<3.15"
dependencies = [
    "django>=5.2,<5.3",
    "psycopg[binary]>=3.2",
    "django-environ>=0.12",
    "whitenoise>=6.9",
    "django-ratelimit>=4.1",
    "django-cotton>=1.5",
    "django-htmx>=1.21",
    "django-csp>=4.0",
]

[dependency-groups]
# Pillow solo lo usan los guiones de `herramientas/` -la imagen de compartir y
# los archivos del logo-, que se corren a mano. Nada de `sitio/` ni de
# `config/` lo importa, asi que no tiene por que viajar al servidor.
dev = [
    "pillow>=12.3.0",
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "pre-commit>=4.0",
    "pip-audit>=2.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "DJ", "C4", "SIM", "RUF"]
ignore = [
    "RUF012",  # los atributos mutables de clase son idiomaticos en Django
]

[tool.ruff.lint.isort]
known-first-party = ["sitio", "config"]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*" = ["E501", "RUF012"]
"config/settings/*" = ["F403", "F405"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = "--strict-markers --reuse-db -q"
testpaths = ["tests", "sitio"]
markers = [
    "peso: presupuesto de peso de la primera carga (RNF-01)",
]

[tool.coverage.run]
source = ["sitio", "config"]
omit = ["*/migrations/*", "*/tests/*"]
